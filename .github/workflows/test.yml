name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, pdo_mysql, gd, zip, intl, bcmath
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar el archivo .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar todas las pruebas
        run: php artisan test
